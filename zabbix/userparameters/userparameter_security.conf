# Custom security checks for Linux hosts.
UserParameter=security.ssh.failures,/usr/local/bin/monitor-ssh-failures.sh 60
UserParameter=security.ssh.failed[*],/usr/local/bin/monitor-ssh-failures.sh $1
UserParameter=security.fail2ban.banned,fail2ban-client status sshd 2>/dev/null | grep 'Banned IP' | awk '{print $NF}' | tr ',' '\n' | wc -l
UserParameter=security.users.logged,who | wc -l
UserParameter=security.passwd.checksum,md5sum /etc/passwd | awk '{print $1}'
UserParameter=security.sudoers.checksum,md5sum /etc/sudoers | awk '{print $1}'
UserParameter=security.fileintegrity.changes,/usr/local/bin/file-integrity-check.sh
UserParameter=security.ssl.daysleft[*],/usr/local/bin/check-ssl-expiry.sh $1 $2
UserParameter=system.updates.pending,sh -c 'if command -v apt >/dev/null 2>&1; then apt list --upgradable 2>/dev/null | grep -c upgradable; elif command -v dnf >/dev/null 2>&1; then dnf check-update --quiet | wc -l; else echo 0; fi'
