# Add to C:\ProgramData\Zabbix\zabbix_agent2.conf on vm-fs01.
UserParameter=fileserver.smb.sessions,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-SmbSession | Measure-Object).Count"
UserParameter=fileserver.openfiles.total,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-SmbOpenFile | Measure-Object).Count"
UserParameter=fileserver.share.response,powershell -NoProfile -ExecutionPolicy Bypass -Command "$s=Get-Date; Get-SmbShare | Out-Null; [int]((Get-Date)-$s).TotalMilliseconds"
UserParameter=fileserver.quota.exceeded,powershell -NoProfile -ExecutionPolicy Bypass -Command "if (Get-Command Get-FsrmQuota -ErrorAction SilentlyContinue) {(Get-FsrmQuota | Where-Object {$_.Usage -gt $_.Size} | Measure-Object).Count} else {0}"

