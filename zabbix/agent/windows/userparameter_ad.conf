# Add to C:\ProgramData\Zabbix\zabbix_agent2.conf on vm-dc01.
UserParameter=ad.service.ntds,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-Service NTDS).Status"
UserParameter=ad.replication.errors,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-ADReplicationFailure -Scope Domain | Measure-Object).Count"
UserParameter=ad.users.locked,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Search-ADAccount -LockedOut -UsersOnly | Measure-Object).Count"
UserParameter=ad.domain.level,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-ADDomain).DomainMode"
UserParameter=ad.dc.count,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-ADDomainController -Filter * | Measure-Object).Count"

